# Render Blueprint — free single-container deploy of the ShelfPulse backend.
# In Render: New > Blueprint > point at this repo. Then set GOOGLE_API_KEY and
# ALLOWED_ORIGINS (your Vercel URL) in the dashboard.
services:
  - type: web
    name: shelfpulse-api
    runtime: docker
    plan: free            # sleeps after ~15 min idle; cold start ~30-60s
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: SHELFPULSE_PROVIDER
        value: anthropic
      - key: SHELFPULSE_MODEL
        value: claude-haiku-4-5   # cheapest model with reliable structured output
      # Phoenix tracing -> Phoenix Cloud (view traces at a real online URL).
      - key: PHOENIX_DISABLED
        value: ""          # empty = tracing on; set "1" to turn it off
      - key: PHOENIX_COLLECTOR_ENDPOINT
        value: https://app.phoenix.arize.com
      - key: PHOENIX_API_KEY
        sync: false        # from app.phoenix.arize.com; never commit it
      - key: ANTHROPIC_API_KEY
        sync: false        # set in dashboard; never commit the key
      - key: APP_PASSWORD
        sync: false        # the gate password (e.g. shelfpulse)
      - key: ALLOWED_ORIGINS
        sync: false        # set to your Vercel domain, e.g. https://shelfpulse.vercel.app
